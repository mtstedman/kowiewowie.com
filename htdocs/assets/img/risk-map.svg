<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" aria-labelledby="risk-map-title risk-map-desc">
  <title id="risk-map-title">Classic Risk world board</title>
  <desc id="risk-map-desc">Original vector world board with the 42 classic Risk territories in six continents: North America, South America, Europe, Africa, Asia and Australia. Dashed lines mark sea routes, including the Alaska to Kamchatka route across the top edge.</desc>
  <defs>
    <linearGradient id="risk-ocean-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c4a"/>
      <stop offset="0.54" stop-color="#0d2d3b"/>
      <stop offset="1" stop-color="#071923"/>
    </linearGradient>
    <pattern id="risk-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="risk-land-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="risk-paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.82  0 0 0 0 0.68  0 0 0 0 0.42  0 0 0 0.16 0"/>
    </filter>
    <radialGradient id="risk-parchment-vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#e8c985" stop-opacity="0.08"/>
      <stop offset="0.66" stop-color="#6e4d28" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#02090d" stop-opacity="0.42"/>
    </radialGradient>
    <pattern id="risk-latitude-lines" width="1000" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 69.5H1000" fill="none" stroke="#f4ddb0" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="url(#risk-ocean-fill)"/>
  <rect width="1000" height="700" fill="url(#risk-grid)"/>
  <rect width="1000" height="700" fill="#cda963" opacity="0.11" filter="url(#risk-paper-grain)" aria-hidden="true"/>
  <rect width="1000" height="700" fill="url(#risk-latitude-lines)" aria-hidden="true"/>
  <rect width="1000" height="700" fill="url(#risk-parchment-vignette)" aria-hidden="true"/>

  <g class="risk-sea-links" aria-hidden="true" fill="none" stroke="#f8d16c" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round">
    <path data-link="alaska kamchatka" d="M50 72C120-8 860-8 930 52"/>
    <path data-link="northwest-territory greenland" d="M250 64L284 68"/>
    <path data-link="ontario greenland" d="M234 144L292 98"/>
    <path data-link="quebec greenland" d="M290 124L312 116"/>
    <path data-link="greenland iceland" d="M366 80L398 96"/>
    <path data-link="iceland great-britain" d="M414 110L432 134"/>
    <path data-link="iceland scandinavia" d="M436 96L482 96"/>
    <path data-link="great-britain scandinavia" d="M450 148L496 138"/>
    <path data-link="great-britain northern-europe" d="M450 176L474 192"/>
    <path data-link="great-britain western-europe" d="M436 198L452 216"/>
    <path data-link="western-europe north-africa" d="M450 288L446 304"/>
    <path data-link="southern-europe north-africa" d="M500 286L490 302"/>
    <path data-link="southern-europe egypt" d="M532 276L538 306"/>
    <path data-link="brazil north-africa" d="M342 428L414 360"/>
    <path data-link="east-africa middle-east" d="M604 390L612 352"/>
    <path data-link="east-africa madagascar" d="M600 446L600 490"/>
    <path data-link="south-africa madagascar" d="M566 520L588 520"/>
    <path data-link="kamchatka japan" d="M936 150L930 174"/>
    <path data-link="mongolia japan" d="M880 206L914 206"/>
    <path data-link="siam indonesia" d="M796 410L818 438"/>
    <path data-link="indonesia new-guinea" d="M860 454L892 446"/>
    <path data-link="indonesia western-australia" d="M836 476L852 512"/>
    <path data-link="new-guinea western-australia" d="M906 460L884 500"/>
    <path data-link="new-guinea eastern-australia" d="M930 464L926 496"/>
  </g>

  <g class="risk-continent-labels" aria-hidden="true" fill="#f7fbff" fill-opacity="0.78" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">
    <text x="500" y="28" text-anchor="middle" fill="#f8d16c" font-size="10">ALASKA ⇄ KAMCHATKA SEA ROUTE</text>
    <text x="24" y="372">NORTH AMERICA</text>
    <text x="24" y="387" font-size="10">+5 ARMIES</text>
    <text x="228" y="600" text-anchor="end">SOUTH AMERICA</text>
    <text x="228" y="615" text-anchor="end" font-size="10">+2 ARMIES</text>
    <text x="446" y="50" text-anchor="middle">EUROPE +5</text>
    <text x="442" y="470" text-anchor="middle">AFRICA +3</text>
    <text x="986" y="292" text-anchor="end">ASIA +7</text>
    <text x="900" y="660" text-anchor="middle">AUSTRALIA +2</text>
  </g>

