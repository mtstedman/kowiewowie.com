<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Risk command map</title>
  <desc id="desc">A stylized tactical island map with connected regions, coastlines, routes, and landmarks for the browser Risk game.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
