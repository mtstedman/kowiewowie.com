name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend validation dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate PostgreSQL version chain
        run: php docs/postgres/db-version-minter.php --validate

      - name: Lint PHP
        shell: bash
        run: |
          while IFS= read -r -d '' php_file; do
            php -l "$php_file"
          done < <(find api database docs htdocs includes tests -type f -name '*.php' -print0)

      - name: Run chess rules regressions
        run: |
          php tests/chess-rules.php
          php tests/chess-opening-book.php
          php tests/chess-opening-book-status.php
          php tests/chess-repository-query-count.php

      - name: Run chess browser regressions
        run: |
          node tests/chess-game-opening-status.test.mjs
          node tests/chess-browser-boot.test.mjs
          node tests/chess-csp-static.test.mjs
          node tests/videos-index-accessibility.test.mjs
          node tests/music-index-accessibility.test.mjs
          node tests/dongs-copy-feedback.test.mjs

      - name: Run public UX accessibility regressions
        run: |
          php tests/public-ux-accessibility.php
          php tests/public-page-security.php

      - name: Run deployment revision regressions
        run: php tests/deployment-revision.php

      - name: Validate collectibles production modules
        run: |
          npm run typecheck
          node tests/collectibles-inventory.test.mjs

      - name: Validate Sonny Angels catalog assets and prices
        run: php tests/sonny-angels-catalog.php

      - name: Validate authored collectibles catalogs and offline sync
        run: |
          php tests/collectibles-catalog-data.php
          php tests/collectibles-catalog-sync.php
          php tests/collectibles-listing-classifier.php
          php tests/collectibles-refresh.php
          php tests/collectibles-search-filters.php
          php tests/collectibles-figure-images.php

      - name: Run murder trivia regressions
        run: |
          php tests/trivia-question-catalog.php
          php tests/trivia-presentation.php
          node tests/trivia-game-model.test.mjs

      - name: Check deployment shell syntax
        run: bash -n deploy/deploy.sh .githooks/post-commit
