# HTTPS API origin for api.wowiekowie.com.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.wowiekowie.com;

    ssl_certificate /etc/letsencrypt/live/api.wowiekowie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wowiekowie.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wowiekowie.com/api;
    index index.php;

    access_log /var/log/nginx/api.wowiekowie.com.access.log;
    error_log /var/log/nginx/api.wowiekowie.com.error.log;

    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.wowiekowie.com;

    return 301 https://$host$request_uri;
}
