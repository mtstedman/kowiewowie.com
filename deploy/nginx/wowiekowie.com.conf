# HTTPS origin for wowiekowie.com and www.wowiekowie.com.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wowiekowie.com www.wowiekowie.com;

    ssl_certificate /etc/letsencrypt/live/wowiekowie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wowiekowie.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wowiekowie.com/htdocs;
    index index.php index.html;

    access_log /var/log/nginx/wowiekowie.com.access.log;
    error_log /var/log/nginx/wowiekowie.com.error.log;

    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # Baseline CSP boundary: Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'"
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https://cards.scryfall.io; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Keep public pages and their API requests on the same origin while
    # dispatching every /api route through the API front controller. The
    # application strips the /api prefix before matching resource routes.
    location ~ ^/api(?:/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/wowiekowie.com/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name wowiekowie.com www.wowiekowie.com;

    return 301 https://$host$request_uri;
}
