# HTTP origin for wowiekowie.com. Certbot adds the TLS listener and redirect
# after DNS points the domain to this server.
server {
    listen 80;
    listen [::]:80;
    server_name wowiekowie.com www.wowiekowie.com;

    root /var/www/wowiekowie.com/htdocs;
    index index.php index.html;

    access_log /var/log/nginx/wowiekowie.com.access.log;
    error_log /var/log/nginx/wowiekowie.com.error.log;

    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
